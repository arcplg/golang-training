services:
  app:
    build:
      context: learning-server
      target: builder
    working_dir: /app/learning-server
    command: "make watch"
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    networks:
      - intranet

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo-init:/docker-entrypoint-initdb.d
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - intranet
  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: mongo
    networks:
      - intranet
  redis:
    image: redis:latest
    volumes:
      - redis_data:/data
    networks:
      - intranet
  minio:
    image: minio/minio:latest
    platform: linux/amd64
    environment:
      MINIO_ACCESS_KEY: s3-minio
      MINIO_SECRET_KEY: s3-minio
      MINIO_BUCKETS: s3-minio
    ports:
      - 19000:19000
      - 19001:19001
    networks:
      - intranet
    volumes:
      - s3_data:/minio/data
    command: server --address ":19000" --console-address ":19001" /minio/data
networks:
  intranet:
    driver: bridge
volumes:
  mongo_data:
  mongo-init:
  redis_data:
  s3_data:
